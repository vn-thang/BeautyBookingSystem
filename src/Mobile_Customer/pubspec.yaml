name: mobile_customer
description: Beauty Booking Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.0
  
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
